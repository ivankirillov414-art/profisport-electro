<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Товары — ProfiSport Electro</title><link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script></head><body><header><a href="../index.html">ProfiSport <span>Electro</span></a><button id="logout" hidden>Выйти</button></header><main><h1>Товары</h1><p id="status" role="status" aria-live="polite"></p><form id="login" hidden><h2>Вход сотрудника</h2><label>Логин<input name="login" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button>Войти</button></form><section id="workspace" hidden><div class="tools"><input id="search" type="search" placeholder="Название или артикул" aria-label="Поиск товара"><button id="add">Добавить товар</button></div><div class="layout"><div id="products"></div><form id="editor" hidden><h2 id="editorTitle">Редактировать товар</h2><div class="fields"><label>Название<input name="name" required maxlength="200"></label><label>Бренд<input name="brand" maxlength="120"></label><label>Артикул<input name="sku" maxlength="120"></label><label>Раздел<select name="type"><option value="">Выберите раздел</option><option>Электросамокат</option><option>Электровелосипед</option><option>Электроскутер</option><option>Электромотоцикл</option><option>Электротрицикл</option></select></label><label>Цена, ₽<input name="price" type="number" min="0" step="1"></label><label>Тип цены<select name="priceKind"><option value="shop">Цена ProfiSport</option><option value="supplier">Цена поставщика</option></select></label><label>Наличие<select name="stockStatus"><option value="unknown">Уточняется</option><option value="in_stock">В наличии</option><option value="out_of_stock">Нет в наличии</option><option value="on_order">Под заказ</option></select></label><label>Цвет<input name="color"></label></div><label>Описание<textarea name="desc" rows="4" maxlength="10000"></textarea></label><h3>Характеристики</h3><div class="fields"><label>Мощность, Вт<input name="power" type="number" min="0"></label><label>Запас хода, км<input name="range" type="number" min="0"></label><label>Вес, кг<input name="weight" type="number" min="0" step="0.1"></label><label>Нагрузка, кг<input name="load" type="number" min="0"></label><label>Аккумулятор<input name="battery"></label><label>Колёса<input name="wheels"></label><label>Тормоза<input name="brakes"></label></div><label>Ссылка на фотографию<input name="photo" placeholder="https://… или assets/photo.jpg"></label><label>Источник характеристик<input name="source" type="url"></label><label>Поставщик<input name="supplier"></label><label class="check"><input name="published" type="checkbox">Показывать в каталоге</label><div class="actions"><button id="save">Сохранить</button><button type="button" id="cancel" class="secondary">Закрыть</button></div><p id="saveStatus" role="status" aria-live="polite"></p></form></div></section></main></body></html>
